<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<style>html,body{margin:0}body{font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>SEM Planificació Auditories</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: estilo consola SEM — cabecera blanca con marca y reloj, filete rojo, barra de mando oscura con pestañas, calendario + panel lateral */
:root{
  --bg:#dfe3e7; --surface:#ffffff; --surface-2:#eef0f2; --line:#cfd4d9;
  --fg:#1d2226; --muted:#5d666e;
  --sem:#d4192c; --sem-ink:#ffffff; --sem-soft:#fbe3e5;
  --bar:#23282d; --bar-ink:#ffffff; --bar-btn:#343a40;
  --yellow:#d4192c; --yellow-ink:#ffffff;
  --vac:#5b7fb8; --vac-bg:#e2e9f5; --ok:#14843f; --ok-bg:#dcf1e3; --warn:#a46200; --warn-bg:#fdefcf; --bad:#c0141f; --bad-bg:#fbe0e2;
  --font-display:"Ubuntu","Segoe UI",system-ui,sans-serif;
  --font-body:"Ubuntu","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121518; --surface:#1b1f23; --surface-2:#23282d; --line:#343a40;
  --fg:#e8ebee; --muted:#9aa3ab; --sem:#ef3b4c; --sem-ink:#ffffff; --sem-soft:#3d1c20;
  --bar:#0b0d0f; --bar-ink:#ffffff; --bar-btn:#2b3036; --yellow:#ef3b4c; --yellow-ink:#ffffff;
  --vac:#7fa3dc; --vac-bg:#1f2a3d; --ok:#5fd394; --ok-bg:#173726; --warn:#f2c14e; --warn-bg:#3a2f12; --bad:#ff8a8f; --bad-bg:#3f1b1d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121518; --surface:#1b1f23; --surface-2:#23282d; --line:#343a40;
  --fg:#e8ebee; --muted:#9aa3ab; --sem:#ef3b4c; --sem-ink:#ffffff; --sem-soft:#3d1c20;
  --bar:#0b0d0f; --bar-ink:#ffffff; --bar-btn:#2b3036; --yellow:#ef3b4c; --yellow-ink:#ffffff;
  --vac:#7fa3dc; --vac-bg:#1f2a3d; --ok:#5fd394; --ok-bg:#173726; --warn:#f2c14e; --warn-bg:#3a2f12; --bad:#ff8a8f; --bad-bg:#3f1b1d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1400px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface);color:var(--fg);border-bottom:4px solid var(--sem)}
.top .wrap{display:flex;align-items:center;gap:12px 28px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;flex-direction:column;gap:8px}
.brand .wm{font-weight:700;font-size:21px;letter-spacing:-.01em;line-height:1}
.brand .sq{display:flex;gap:22px}.brand .sq i{width:18px;height:18px;background:var(--sem);display:block}
.ttl b{display:block;font-size:24px;font-weight:700;line-height:1.2}
.ttl span{color:var(--muted);font-size:15px}
.clock{margin-left:auto;text-align:right}
.clock b{display:block;font:700 34px var(--font-display);font-variant-numeric:tabular-nums;line-height:1}
.clock span{color:var(--muted);font-size:14px}
.cmd{background:var(--bar);color:var(--bar-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.cmd .wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:8px}
.badge{background:var(--sem);color:#fff;font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:13px;padding:5px 10px;border-radius:3px}
.who{margin-left:auto;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.role{text-transform:uppercase;letter-spacing:.06em;font-size:12px;border:1px solid currentColor;padding:2px 8px;border-radius:3px}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
nav.tabs button{font:500 15px var(--font-body);border:1px solid #4a5157;background:var(--bar-btn);color:var(--bar-ink);padding:7px 14px;border-radius:4px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--sem);border-color:var(--sem)}
.notice{margin-top:12px;padding:10px 14px;border-radius:6px;background:var(--warn-bg);color:var(--fg);font-size:14px;border-left:4px solid var(--warn)}
main{padding-block:16px 48px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@media (max-width:960px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.stack{display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--font-display);font-size:24px;margin:0;letter-spacing:.01em;text-wrap:balance}
h3{font-size:14px;font-weight:700;margin:0 0 10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--fg);padding:7px 12px;font:600 14px var(--font-body);cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--sem);color:var(--sem-ink)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 12px;border-radius:6px;font:600 14px var(--font-body);cursor:pointer}
.btn:hover{border-color:var(--sem)}
.btn.primary{background:var(--sem);color:var(--sem-ink);border-color:var(--sem)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:3px solid #2f7de1;outline-offset:2px}
.period{font-family:var(--font-display);font-size:22px;text-transform:capitalize;min-width:0}
select,input{font:15px var(--font-body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;align-items:end}
.mono{font-family:var(--font-mono);font-size:13px;font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}
/* month */
.scroll{overflow-x:auto}
.month{display:grid;grid-template-columns:repeat(7,minmax(92px,1fr));gap:4px;min-width:660px}
.dow{font-family:var(--font-display);text-transform:uppercase;font-size:13px;letter-spacing:.06em;color:var(--muted);padding:2px 6px}
.cell{background:var(--surface);border:1px solid var(--line);border-radius:6px;min-height:96px;padding:6px;display:flex;flex-direction:column;gap:4px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.cell:hover{border-color:var(--sem)}
.cell.out{opacity:.4}
.cell.today .dnum{background:var(--fg);color:var(--surface);border-radius:4px;padding:0 6px}
.cell.cv-ok{border:2px solid var(--ok)}.cell.cv-part{border:2px solid var(--warn)}.cell.cv-none{border:2px solid var(--bad)}
.cell .row{display:flex;justify-content:space-between;align-items:center;gap:4px}
.dnum{font-family:var(--font-display);font-size:18px}
.cov{font:600 11px var(--font-mono);padding:1px 6px;border-radius:99px}
.cov.ok{background:var(--ok-bg);color:var(--ok)} .cov.part{background:var(--warn-bg);color:var(--warn)} .cov.none{background:var(--bad-bg);color:var(--bad)}

.chips{display:flex;flex-wrap:wrap;gap:3px}
.chip{font-size:11.5px;font-weight:600;padding:1px 6px;border-radius:4px;background:var(--sem-soft);color:var(--fg);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip.pend{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.chip.pend::before{content:"? ";}
.chip.c-ok{background:var(--ok-bg);color:var(--ok)}.chip.c-warn{background:var(--warn-bg);color:var(--warn)}
.slot.s-ok{border-left-color:var(--ok)}.slot.s-warn{border-left-color:var(--warn)}
/* week */
.week{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:6px;min-width:920px}
.wcol{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px;display:flex;flex-direction:column;gap:6px;min-height:220px}
.wcol header{display:flex;justify-content:space-between;align-items:baseline;cursor:pointer}
.slot{border-left:3px solid var(--sem);background:var(--surface-2);border-radius:4px;padding:5px 7px;font-size:13px}
.slot.pend{border-left-color:var(--line);color:var(--muted)}
.slot .n{font-weight:700;color:var(--fg)}
/* year */
.year{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px}
.mini h4{margin:0 0 6px;font-family:var(--font-display);font-size:17px;text-transform:capitalize;cursor:pointer}
.mini .g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mini .d{aspect-ratio:1;border-radius:3px;font:500 10px var(--font-mono);display:grid;place-items:center;background:var(--surface-2);color:var(--muted);border:0;padding:0;cursor:pointer;max-width:100%}
.mini .d.ok{background:var(--ok);color:var(--surface)} .mini .d.part{background:var(--warn);color:var(--surface)}
.mini .d.blank{background:none;cursor:default}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px}
/* day/list */
.list{display:flex;flex-direction:column;gap:8px}
.item{border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;background:var(--surface)}
.item .t{font-weight:700}
.item .s{font-size:13px;color:var(--muted)}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill{font:600 12px var(--font-body);text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:99px}
.pill.asignado{background:var(--ok-bg);color:var(--ok)} .pill.pendiente{background:var(--warn-bg);color:var(--warn)} .pill.descartado{background:var(--surface-2);color:var(--muted)}
.comp{grid-column:1/-1;font-size:13px;background:var(--surface-2);border-radius:5px;padding:6px 9px}
.comp.missing{background:var(--bad-bg);color:var(--bad)}
.compform{grid-column:1/-1}
/* counter */
.ctr{display:flex;flex-direction:column;gap:10px}
.ctr .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:14px}
.bar{grid-column:1/-1;height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sem)}
.bar i.over{background:var(--warn)}
.big{font-family:var(--font-display);font-size:40px;line-height:1}
table{border-collapse:collapse;width:100%;min-width:620px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:14px}
th{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.05em;font-size:13px;color:var(--muted)}
td input{width:76px}
.empty{color:var(--muted);font-size:14px;padding:10px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:6px;font-weight:600;z-index:20}
@media (prefers-reduced-motion:no-preference){.cell,.btn{transition:border-color .15s}}

.push{margin-left:auto}
.lead{margin:4px 0 14px;color:var(--muted);max-width:72ch}
.hint{font-size:13px;color:var(--muted);margin:8px 0}
.narrow{max-width:560px;margin:24px auto}
.mt{margin-top:16px}
.span{grid-column:1/-1}
.cap{text-transform:none}.cap::first-letter{text-transform:uppercase}span.cap{display:inline-block}
.muted{color:var(--muted)}
.badtxt{color:var(--bad)} .warntxt{color:var(--warn)} .oktxt{color:var(--ok)}
.nb{display:inline-block;margin-left:7px;background:#fff;color:var(--sem);font-weight:700;font-size:12px;min-width:20px;padding:0 6px;border-radius:99px;text-align:center}
nav.tabs button[aria-selected="true"] .nb{color:var(--sem)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat span{font-size:13px;color:var(--muted);font-weight:500}
.stat b{font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat small,.big small{font-size:18px;color:var(--muted);font-weight:500}
.stat.warn{border-left-color:var(--warn)} .stat.bad{border-left-color:var(--bad)}
.stat.bad b{color:var(--bad)}
.panel.alert{border-color:var(--bad);border-left:5px solid var(--bad)}
.vgroup{border-top:1px solid var(--line);padding-block:10px}
.vhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.linkbtn{background:none;border:0;padding:0;font:700 16px var(--font-body);color:var(--fg);cursor:pointer;text-transform:none;text-align:left}.linkbtn::first-letter{text-transform:uppercase}
.linkbtn:hover{color:var(--sem);text-decoration:underline}
.vrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:7px 10px;background:var(--surface-2);border-radius:5px;margin-top:5px}
.vn{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;min-width:0}
.vn .s{font-size:13px;color:var(--muted)}
@media (max-width:560px){.vrow{grid-template-columns:minmax(0,1fr)}.vrow .acts{justify-content:flex-start}}
.tag{font-size:11px;font-weight:700;color:var(--sem);text-transform:uppercase;letter-spacing:.04em}
.grid-half{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start}
.chip.vac{background:var(--vac-bg);color:var(--vac)}
.slot.vacs{border-left-color:var(--vac);background:var(--vac-bg)}
.mini .d.vacd{background:var(--vac);color:var(--surface)}
.mini .d.hd{font-size:9px}
.pill.vacp{background:var(--vac-bg);color:var(--vac)}
.star{color:var(--sem);font-size:12px;margin-left:3px;vertical-align:super}
.dayhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.dayhead p{margin:0}
.f.inline{flex-direction:row;align-items:center;gap:8px}
.f.inline input{width:70px}
.f.chk span{display:flex;gap:6px;align-items:center;color:var(--fg);font-weight:500;padding-bottom:9px}
td input.wide{width:220px}
td input[type=checkbox],.f.chk input{width:18px;height:18px;accent-color:var(--sem)}
.row-btn{text-align:left;display:flex;justify-content:space-between;gap:8px}
.legend i.dash{border:1px dashed var(--muted)}
.big small{font-size:20px}
table.sit td,table.sit th{text-align:right;white-space:nowrap}table.sit td:first-child,table.sit th:first-child{text-align:left}
table.sit tr.cur td{background:var(--sem-soft)}
table.sit tfoot th,table.sit tfoot td{border-top:2px solid var(--fg);font-weight:700}
.notice.sim{background:var(--sem-soft);border-left-color:var(--sem);display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.addday{border:1px dashed var(--sem);border-radius:6px;padding:12px 14px;background:var(--sem-soft)}
table.inf td.n,table.inf th.n{text-align:right}
table.inf td.wrap{white-space:normal;min-width:180px;max-width:360px}
table.inf tfoot th,table.inf tfoot td{border-top:2px solid var(--fg);font-weight:700}
.panel.avis{border-left:5px solid var(--sem);margin-bottom:16px}
.picker{margin-bottom:6px}
.pk-grid{display:grid;grid-template-columns:repeat(7,minmax(34px,54px));gap:4px;margin-bottom:10px}
.pk-h{font-size:12px;font-weight:700;color:var(--muted);text-align:center;text-transform:uppercase}
.pk{height:40px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:5px;font:600 14px var(--font-body);cursor:pointer;padding:0}
.pk:hover:not(:disabled){border-color:var(--sem)}
.pk:disabled{cursor:default;color:var(--muted);background:var(--surface-2)}
.pk.pk-as{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}.pk.pk-pe{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}.pk.pk-va{background:var(--vac-bg);color:var(--vac);border-color:var(--vac)}
.pk[aria-pressed="true"]{background:var(--sem);color:var(--sem-ink);border-color:var(--sem)}
td input.mid{width:150px}
table.quad{min-width:900px}
table.quad th,table.quad td{padding:3px 2px;text-align:center;font:500 11px var(--font-mono);border:1px solid var(--line);min-width:22px;letter-spacing:0}
table.quad th{font-weight:700;color:var(--fg)}
table.quad td.q-n,table.quad th:first-child{text-align:left;font:600 13px var(--font-body);white-space:nowrap;padding:3px 8px;text-transform:none}
.q-A,.q-AC{background:var(--ok-bg);color:var(--ok);font-weight:700}.q-C{background:var(--warn-bg);color:var(--warn);font-weight:700}.q-V{background:var(--vac-bg);color:var(--vac)}.q-p{color:var(--muted)}.q-wk{background:var(--surface-2)}
.gsteps{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px 28px}
.gstep{display:flex;gap:12px;min-width:0}
.gnum{flex:none;width:34px;height:34px;background:var(--sem);color:var(--sem-ink);font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center}
.gt{margin:0 0 3px;font-size:17px;font-weight:700;text-transform:none;letter-spacing:0;color:var(--fg)}
.gd{margin:0 0 6px;color:var(--muted);max-width:60ch}
.gleg{display:flex;align-items:center;gap:10px}
.gsw{display:inline-block;width:34px;height:22px;box-sizing:border-box;flex:none}
details summary{cursor:pointer;color:var(--muted);font-weight:500}
</style>

</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand" aria-label="emergències mèdiques"><span class="wm">emergències mèdiques</span><span class="sq" aria-hidden="true"><i></i><i></i><i></i><i></i></span></div>
    <div class="ttl"><b>Planificació d'auditories</b><span>Control d'auditors · Unitats assistencials</span></div>
    <div class="clock"><b id="hora">--:--:--</b><span id="fecha"></span></div>
  </div>
</header>
<div class="cmd"><div class="wrap">
  <span class="badge">Auditories</span>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <div class="who" id="who"><span class="role">Carregant…</span></div>
</div></div>
<div class="wrap">
  <div id="notice"></div>
  <main id="main"><p class="empty">Carregant la planificació…</p></main>
</div>
<div class="toast" id="toast" hidden></div>

<style>
.gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.gate .box{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--sem);border-radius:8px;padding:28px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px}
.gate .brand{margin-bottom:6px}
.gate h1{font-size:20px;margin:0}
.gate input{width:100%}
.gate .err{color:var(--bad);font-size:14px;min-height:20px;margin:0}
.gate ol{margin:0;padding-left:20px;font-size:14px;line-height:1.6}
.who .btn{background:var(--bar-btn);color:var(--bar-ink);border-color:#4a5157}
</style>
<div class="gate" id="gate" hidden></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ================= CONFIGURACIÓ (edita només aquest bloc) ================= */
// 1) Enganxa aquí la configuració del teu projecte de Firebase
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCmCuTuf1lgjYl51zqgz-QLVZ2x6HdLjhg",
  authDomain: "auditor-sem.firebaseapp.com",
  projectId: "auditor-sem",
  storageBucket: "auditor-sem.firebasestorage.app",
  messagingSenderId: "255911122537",

};
// 2) Usuaris administradors (sempre tenen accés de gestor, encara que no estiguin vinculats)
const ADMINS = ["xrico"];
// 3) Domini intern dels usuaris: l'usuari "xrico" és el compte "xrico@auditories.sem" a Firebase
const USER_DOMAIN = "auditories.sem";
/* ========================================================================== */

(function(){
  const gate=document.getElementById("gate");
  const marca=`<div class="brand"><span class="wm">emergències mèdiques</span><span class="sq" aria-hidden="true"><i></i><i></i><i></i><i></i></span></div>`;
  const pending={};const waiters={};
  const ready=new Promise(res=>{waiters.go=res});
  window.SEM_AUTH=true;
  window.claude={use:name=>ready.then(api=>api[name]??null)};
  const noCfg=!FIREBASE_CONFIG.apiKey||FIREBASE_CONFIG.apiKey==="ENGANXA_AQUI";
  if(noCfg||!window.firebase){
    gate.hidden=false;
    gate.innerHTML=`<div class="box">${marca}<h1>${noCfg?"Falta configurar l'aplicació":"No s'ha pogut carregar l'aplicació"}</h1>${noCfg?`<ol><li>Crea un projecte a Firebase.</li><li>Activa l'accés amb correu i contrasenya.</li><li>Crea la base de dades Firestore.</li><li>Enganxa la configuració del projecte al bloc CONFIGURACIÓ d'aquest fitxer.</li></ol>`:`<p>Comprova la connexió a internet i torna a carregar la pàgina.</p>`}</div>`;
    return;
  }
  firebase.initializeApp(FIREBASE_CONFIG);
  const auth=firebase.auth(),fs=firebase.firestore();
  const toEmail=u=>{u=u.trim().toLowerCase();return u.includes("@")?u:`${u}@${USER_DOMAIN}`};
  const userName=()=>{const e=auth.currentUser?.email||"";return e.endsWith("@"+USER_DOMAIN)?e.slice(0,-USER_DOMAIN.length-1):e};
  window.SEM_USER=userName;
  const ds=s=>({id:s.id,exists:!!s.exists,data:()=>s.data(),metadata:s.metadata||{fromCache:false,hasPendingWrites:false}});
  const qs=s=>({docs:s.docs.map(ds),size:s.size,empty:s.empty,metadata:s.metadata||{fromCache:false,hasPendingWrites:false}});
  const wrapDoc=r=>({id:r.id,path:r.path,get:()=>r.get().then(ds),set:d=>r.set(d),update:d=>r.set(d,{merge:true}),delete:()=>r.delete(),
    onSnapshot:(n,e)=>r.onSnapshot(s=>n(ds(s)),e),collection:p=>wrapCol(r.collection(p))});
  const wrapQ=c=>({get:()=>c.get().then(qs),onSnapshot:(n,e)=>c.onSnapshot(s=>n(qs(s)),e),orderBy:(f,d)=>wrapQ(c.orderBy(f,d||"asc")),limit:n=>wrapQ(c.limit(n)),where:(f,o,v)=>wrapQ(c.where(f,o,v))});
  const wrapCol=c=>({...wrapQ(c),path:c.path,doc:id=>wrapDoc(c.doc(id))});
  // Rols per a les regles de seguretat: un document per usuari a la col·lecció "rols"
  window.SEM_SYNC_ROLS=async(nou,vell)=>{
    const us=new Set();
    for(const [pid,x] of Object.entries(nou||{}))if(x.usuario){us.add(x.usuario);await fs.doc("rols/"+toEmail(x.usuario)).set({pid,gestor:!!x.gestor,auditor:!!x.auditor})}
    for(const x of Object.values(vell||{}))if(x.usuario&&!us.has(x.usuario))await fs.doc("rols/"+toEmail(x.usuario)).delete();
  };
  const api={
    db:{doc:p=>wrapDoc(fs.doc(p)),collection:p=>wrapCol(fs.collection(p))},
    user:{id:async()=>auth.currentUser.uid,isOwner:async()=>ADMINS.includes(userName()),canEdit:async()=>ADMINS.includes(userName()),can:async()=>true,profiles:async()=>({})},
    downloads:{save:async({filename,data})=>{const b=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}}
  };
  const ERR={"auth/invalid-credential":"Usuari o contrasenya incorrectes.","auth/wrong-password":"Usuari o contrasenya incorrectes.","auth/user-not-found":"Usuari o contrasenya incorrectes.","auth/invalid-email":"L'usuari no és vàlid.","auth/too-many-requests":"Massa intents. Espera uns minuts i torna-ho a provar.","auth/network-request-failed":"No hi ha connexió. Torna-ho a provar.","auth/weak-password":"La contrasenya ha de tenir com a mínim 6 caràcters.","auth/requires-recent-login":"Per seguretat, surt, torna a entrar i canvia la contrasenya tot seguit."};
  function loginForm(){
    gate.hidden=false;
    gate.innerHTML=`<form class="box" id="login-form">${marca}<h1>Planificació d'auditories</h1>
      <label class="f">Usuari<input id="lg-user" autocomplete="username" required autofocus></label>
      <label class="f">Contrasenya<input id="lg-pass" type="password" autocomplete="current-password" required></label>
      <p class="err" id="lg-err" role="alert"></p><button class="btn primary" id="lg-btn">Entra</button></form>`;
    document.getElementById("login-form").addEventListener("submit",async ev=>{
      ev.preventDefault();ev.stopPropagation();const b=document.getElementById("lg-btn"),er=document.getElementById("lg-err");
      b.disabled=true;er.textContent="";
      try{await auth.signInWithEmailAndPassword(toEmail(document.getElementById("lg-user").value),document.getElementById("lg-pass").value)}
      catch(e){er.textContent=ERR[e.code]||"No s'ha pogut iniciar la sessió.";b.disabled=false}
    });
  }
  function passForm(){
    gate.hidden=false;
    gate.innerHTML=`<form class="box" id="pass-form">${marca}<h1>Canvia la contrasenya</h1>
      <label class="f">Contrasenya nova<input id="pw-1" type="password" autocomplete="new-password" minlength="6" required></label>
      <label class="f">Repeteix la contrasenya<input id="pw-2" type="password" autocomplete="new-password" minlength="6" required></label>
      <p class="err" id="pw-err" role="alert"></p><div class="acts"><button type="button" class="btn" id="pw-cancel">Cancel·la</button><button class="btn primary">Desa la contrasenya</button></div></form>`;
    document.getElementById("pw-cancel").addEventListener("click",()=>{gate.hidden=true;gate.innerHTML=""});
    document.getElementById("pass-form").addEventListener("submit",async ev=>{
      ev.preventDefault();ev.stopPropagation();const er=document.getElementById("pw-err"),a=document.getElementById("pw-1").value;
      if(a!==document.getElementById("pw-2").value){er.textContent="Les dues contrasenyes no coincideixen.";return}
      try{await auth.currentUser.updatePassword(a);gate.hidden=true;gate.innerHTML="";if(window.toast)toast("Contrasenya canviada")}
      catch(e){er.textContent=ERR[e.code]||"No s'ha pogut canviar la contrasenya."}
    });
  }
  let started=false;
  auth.onAuthStateChanged(u=>{
    if(u){gate.hidden=true;gate.innerHTML="";if(!started){started=true;waiters.go(api)}}
    else if(started){location.reload()}
    else loginForm();
  });
  document.addEventListener("click",ev=>{
    const b=ev.target.closest("[data-a]");if(!b)return;
    if(b.dataset.a==="logout")auth.signOut();
    if(b.dataset.a==="chpass")passForm();
  });
})();
</script>
<script>
const FRANJAS = {
  manana:{l:"Matí",i:"08:00",f:"15:00"}, tarde:{l:"Tarda",i:"15:00",f:"22:00"},
  noche:{l:"Nit",i:"22:00",f:"08:00"}, jornada:{l:"Jornada 12 h",i:"08:00",f:"20:00"},

const RECURSOS = ["SVAm","SVAi","VIR","ECO","UIS","Altres"];

const MESES = ["gener","febrer","març","abril","maig","juny","juliol","agost","setembre","octubre","novembre","desembre"];
const DOW = ["Dl","Dt","Dc","Dj","Dv","Ds","Dg"];

const S = {
  db:null, user:null, uid:null, owner:false, demo:false, canWrite:true,
  equipo:{}, eqLoaded:false,
  cfg:{minPorDia:2, minDias:{}, objetivoDefecto:2, objetivosMes:{}},
  dias:new Map(), vac:new Map(), subs:new Map(), names:new Map(),
  tab:"calendario", mode:"mes", cursor:new Date(), filtro:"todos", vacPid:null, inf:null, dl:null, vista:"gestor", verComo:null, username:null, proposta:null, selMes:null, selDias:new Set(), editSol:null, log:[], logSub:false, avisOk:false, quadMes:null, sitPid:null, sitYear:new Date().getFullYear(),
  editComp:null, busy:false, loaded:false, stale:false, skipLink:false
};
let saved={}; try{saved=JSON.parse(localStorage.getItem("sem-ui")||"{}")}catch(e){}
if(saved.mode) S.mode=saved.mode;
if(saved.tab) S.tab=saved.tab;
if(saved.vista) S.vista=saved.vista;
if(saved.verComo) S.verComo=saved.verComo;
function remember(){try{localStorage.setItem("sem-ui",JSON.stringify({mode:S.mode,tab:S.tab,vista:S.vista,verComo:S.verComo}))}catch(e){}}

/* ---------- fechas ---------- */
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const mondayOf=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());return addDays(x,-((x.getDay()+6)%7))};
const ym=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const todayIso=iso(new Date());
const fLarga=s=>parse(s).toLocaleDateString("ca-ES",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
const fCorta=s=>parse(s).toLocaleDateString("ca-ES",{weekday:"short",day:"numeric",month:"short"});
const fMes=d=>`${MESES[d.getMonth()]} ${d.getFullYear()}`;
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slug=n=>n.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"persona";
const clone=o=>JSON.parse(JSON.stringify(o||{}));

/* ---------- equipo y roles ---------- */
const realPid=()=>{if(window.SEM_AUTH)return S.username?Object.keys(S.equipo).find(p=>S.equipo[p].usuario===S.username)||null:null;return S.uid?Object.keys(S.equipo).find(p=>S.equipo[p].uid===S.uid)||null:null};
const realGestor=()=>{const p=realPid();return (p&&!!S.equipo[p].gestor)||S.owner};
const realAuditor=()=>{const p=realPid();return !!(p&&S.equipo[p].auditor)};
const simulando=()=>realGestor()&&S.vista==="auditor"&&!!S.verComo&&!!S.equipo[S.verComo]?.auditor;
const preview=()=>simulando()&&S.verComo!==realPid();
const mePid=()=>simulando()?S.verComo:realPid();
const isGestor=()=>realGestor()&&!simulando();
const isAuditor=()=>simulando()||realAuditor();
const soloPropio=()=>!isGestor();
const nombre=p=>S.equipo[p]?.nombre||"Persona eliminada";
const corto=p=>{const n=nombre(p).trim().split(/\s+/);return n.length>1?`${n[0]} ${n[1][0]}.`:n[0]};
const porNombre=(a,b)=>nombre(a).localeCompare(nombre(b),"ca");
const auditores=()=>Object.keys(S.equipo).filter(p=>S.equipo[p].auditor).sort(porNombre);
const gestores=()=>Object.keys(S.equipo).filter(p=>S.equipo[p].gestor).sort(porNombre);

/* ---------- reglas ---------- */
const minFor=k=>{const v=S.cfg.minDias?.[k];return Number.isFinite(v)?v:S.cfg.minPorDia};
const objOverride=(p,mes)=>{const v=S.cfg.objetivosMes?.[mes]?.[p];return Number.isFinite(v)?v:null};
const objetivo=(p,mes)=>objOverride(p,mes)??S.cfg.objetivoDefecto;
const enVac=(p,k)=>(S.vac.get(p)||[]).some(v=>v.desde<=k&&k<=v.hasta);
const covClass=(n,k)=>{const m=minFor(k);return n>=m?"ok":n>0?"part":"none"};

/* ---------- datos derivados ---------- */
function entradas(){const out=[];for(const p of auditores()){const m=S.dias.get(p);if(m)for(const[f,d]of m)out.push({pid:p,fecha:f,...d})}return out}
function porFecha(){const map=new Map();for(const e of entradas()){if(!map.has(e.fecha))map.set(e.fecha,[]);map.get(e.fecha).push(e)}for(const l of map.values())l.sort((a,b)=>porNombre(a.pid,b.pid));return map}
const asignados=(list)=>list.filter(e=>e.estado==="asignado").length;
function asignadosMes(p,mes){let n=0;const m=S.dias.get(p);if(m)for(const[f,d]of m)if(d.estado==="asignado"&&f.startsWith(mes))n++;return n}
function vacDiasMes(p,mes){const[y,m]=mes.split("-").map(Number),days=new Date(y,m,0).getDate();let n=0;for(let d=1;d<=days;d++)if(enVac(p,`${mes}-${pad(d)}`))n++;return n}
const pendientes=()=>entradas().filter(e=>e.estado==="pendiente").sort((a,b)=>a.fecha.localeCompare(b.fecha)||porNombre(a.pid,b.pid));
const COMP_CAMPS=[["fecha","el dia que lliures"],["recurso","el tipus d'unitat"],["indicativo","l'indicatiu de la unitat"],["territorio","el territori"],["inicio","l'hora d'inici"],["fin","l'hora de fi"]];
const compFalta=c=>COMP_CAMPS.filter(([k])=>!String(c?.[k]??"").trim()).map(x=>x[1]);
const compOk=c=>!!c&&!compFalta(c).length;
const HORES=d=>{const o=[];for(let m=360;m<=(d==="24"?480:540);m+=30)o.push(`${pad(Math.floor(m/60))}:${pad(m%60)}`);return o};
const fiDe=(ini,d)=>{if(d==="24")return ini;const[h,m]=ini.split(":").map(Number);return `${pad((h+12)%24)}:${pad(m)}`};
const durTxt=c=>c?.durada==="24"?" (24 h)":c?.durada==="12"?" (12 h)":"";
const horaComp=c=>c?.inicio?`${c.inicio}-${c.fin}${durTxt(c)}`:"";
const unitat=c=>c?[c.recurso,c.indicativo].filter(Boolean).join(" "):"";
const hor=e=>e.inicio?`${e.inicio}–${e.fin}`:"Horari no indicat";
function compTxt(c){if(!c)return "";const d=c.fecha?`Lliura el ${fCorta(c.fecha)}`:"Lliura";const r=c.recurso||c.indicativo||c.territorio?` a ${esc([unitat(c),c.territorio].filter(Boolean).join(" · "))}`:"";const ft=compOk(c)?"":` · falta ${esc(compFalta(c).join(", "))}`;const h=c.inicio&&c.fin?` · <span class="mono">${esc(c.inicio)}–${esc(c.fin)}${durTxt(c)}</span>`:"";return esc(d)+r+h+ft}
const sinComp=p=>entradas().filter(e=>e.estado==="asignado"&&!compOk(e.comp)&&(!p||e.pid===p)).sort((a,b)=>a.fecha.localeCompare(b.fecha));
const visibles=list=>soloPropio()?list.filter(e=>e.pid===mePid()):S.filtro==="todos"?list:list.filter(e=>e.pid===S.filtro);
const deVacaciones=k=>(soloPropio()?[mePid()].filter(Boolean):auditores()).filter(p=>enVac(p,k));
const filtroEf=()=>soloPropio()?(mePid()||"__nadie"):S.filtro;

/* ---------- UI base ---------- */
const $=id=>document.getElementById(id);
function toast(msg){const t=$("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2800)}
const badge=n=>n?`<span class="nb">${n}</span>`:"";

function renderHeader(){
  const p=mePid(),roles=[];
  if(simulando())roles.push("Vista auditor/a");else{if(isGestor())roles.push("Gestor/a");if(isAuditor())roles.push("Auditor/a")}
  $("who").innerHTML=`<span>${esc(p?nombre(p):S.demo?"":"Sense identificar")}</span>${roles.map(r=>`<span class="role">${r}</span>`).join("")}${window.SEM_AUTH&&S.uid?`<button class="btn sm" data-a="chpass">Contrasenya</button><button class="btn sm" data-a="logout">Surt (${esc(window.SEM_USER())})</button>`:""}`;
  const g=isGestor(),a=isAuditor(),tabs=[["calendario","Calendari",0]];
  if(g) tabs.push(["validar","Pendents de validar",pendientes().filter(e=>e.fecha>=todayIso).length+solicituds().length]);
  if(a) tabs.push(["mis","La meva disponibilitat",sinComp(p).length]);
  if(a||g) tabs.push(["situacion",g?"Situació per auditor":"La meva situació",0]);
  if(a||g) tabs.push(["vacaciones","Vacances",0]);
  if(g) tabs.push(["informe","Informe",0]);
  if(g){tabs.push(["objetivos","Objectius i regles",0]);tabs.push(["equipo","Equip i rols",0]);tabs.push(["historial","Historial",0])}
  if(a||g) tabs.push(["guia","Guia d'ús",0]);
  if(realGestor()) tabs.push(["perfil","El meu perfil",0]);
  if(!tabs.some(t=>t[0]===S.tab)) S.tab="calendario";
  $("tabs").innerHTML=tabs.map(([k,l,n])=>`<button role="tab" data-a="tab" data-v="${k}" aria-selected="${S.tab===k}">${l}${badge(n)}</button>`).join("");
  let n="";
  if(simulando()) n+=`<div class="notice sim"><b>Estàs veient l'aplicació com a auditor/a: ${esc(nombre(S.verComo))}.</b> ${preview()?"Vista prèvia: pots navegar i veure'n els límits, però no es desa cap canvi.":"Pots treballar amb les teves dades d'auditor/a."} <button class="btn sm" data-a="vista" data-v="gestor">Torna a la vista de gestor/a</button></div>`;
  if(S.demo) n+=`<div class="notice">Vista d'exemple amb disponibilitats fictícies: la base de dades compartida no està disponible en aquesta vista. A l'aplicació publicada veuràs les dades reals de l'equip.</div>`;
  else if(S.stale) n+=`<div class="notice">Encara no es pot connectar amb la base de dades. El que veus pot no estar actualitzat.</div>`;
  else if(!S.canWrite) n+=`<div class="notice">Tens accés només de lectura. Demana al propietari de l'aplicació que et doni permís de participació.</div>`;
  $("notice").innerHTML=n;
}
function render(){
  renderHeader();
  const m=$("main");
  if(needsLink()){m.innerHTML=vVincular();return}
  const v={calendario:vCalendario,validar:vValidar,mis:vMis,vacaciones:vVacaciones,situacion:vSituacion,perfil:vPerfil,informe:vInforme,objetivos:vObjetivos,equipo:vEquipo,historial:vHistorial,guia:vGuia}[S.tab]||vCalendario;
  m.innerHTML=v();
}
const needsLink=()=>!S.demo&&S.uid&&S.eqLoaded&&!realPid()&&!S.skipLink&&!(window.SEM_AUTH&&S.owner);

/* ---------- identificación ---------- */
function vVincular(){
  if(window.SEM_AUTH)return `<section class="panel narrow"><h2>El teu usuari encara no està assignat</h2><p class="lead">L'usuari «${esc(S.username||"")}» no està assignat a cap persona de l'equip. Demana a un gestor/a que escrigui el teu usuari al costat del teu nom a «Equip i rols».</p></section>`;
  const libres=Object.keys(S.equipo).filter(p=>!S.equipo[p].uid).sort(porNombre);
  return `<section class="panel narrow"><h2>Qui ets?</h2>
  <p class="lead">Selecciona el teu nom de l'equip per vincular-lo al teu compte. Només ho hauràs de fer una vegada.</p>
  ${libres.length?`<form class="form" data-form="link"><label class="f">El teu nom<select id="link-pid" name="pid" required><option value="">Selecciona…</option>${libres.map(p=>`<option value="${esc(p)}">${esc(nombre(p))}</option>`).join("")}</select></label><div><button class="btn primary">Sóc jo</button></div></form>`
  :`<p class="empty">No hi ha noms lliures a l'equip. Demana a un gestor/a que t'afegeixi a "Equip i rols".</p>`}
  <p class="hint">Si el teu nom no apareix o ja està vinculat a un altre compte, avisa un gestor/a.</p>
  ${S.owner?`<p><button class="btn" data-a="skiplink">Continua com a propietari sense vincular</button></p>`:`<p><button class="btn" data-a="skiplink">Només consulta el calendari</button></p>`}</section>`;
}

/* ---------- calendario ---------- */
function filtroSelect(){
  return `<select id="filtro" aria-label="Filtra per auditor"><option value="todos">Tots els auditors</option>${auditores().map(p=>`<option value="${esc(p)}" ${S.filtro===p?"selected":""}>${esc(nombre(p))}</option>`).join("")}</select>`;
}
function periodo(){
  const c=S.cursor;
  if(S.mode==="dia") return fLarga(iso(c));
  if(S.mode==="semana"){const a=mondayOf(c),b=addDays(a,6);return `${a.getDate()} ${MESES[a.getMonth()].slice(0,3)} – ${b.getDate()} ${MESES[b.getMonth()].slice(0,3)} ${b.getFullYear()}`}
  if(S.mode==="mes") return fMes(c);
  return String(c.getFullYear());
}
function vCalendario(){
  const modes=[["dia","Dia"],["semana","Setmana"],["mes","Mes"],["ano","Any"]];
  const tb=`<div class="toolbar">
    <div class="seg" role="group" aria-label="Vista">${modes.map(([k,l])=>`<button data-a="mode" data-v="${k}" aria-pressed="${S.mode===k}">${l}</button>`).join("")}</div>
    <div class="seg"><button data-a="nav" data-v="-1" aria-label="Anterior">‹</button><button data-a="hoy">Avui</button><button data-a="nav" data-v="1" aria-label="Següent">›</button></div>
    <span class="period">${esc(periodo())}</span>${isAuditor()&&S.mode!=="dia"?`<span class="hint" style="margin:0">Prem un dia per afegir la teva disponibilitat</span>`:""}${soloPropio()?"":`<span class="push">${filtroSelect()}</span>`}</div>`;

/* ---------- situación personal ---------- */
function vSituacion(){

/* ---------- informe (gestor) ---------- */
const fDMY=s=>s?s.split("-").reverse().join("/"):"";
function infDefaults(){const n=new Date(),a=new Date(n.getFullYear(),n.getMonth(),1),b=new Date(n.getFullYear(),n.getMonth()+1,0);return {desde:iso(a),hasta:iso(b),pid:"todos",ocultar:true}}
function datosInforme(){
  const I=S.inf,ids=I.pid==="todos"?auditores():[I.pid];
  const grups=ids.map(p=>({pid:p,rows:entradas().filter(e=>e.pid===p&&e.estado==="asignado"&&e.fecha>=I.desde&&e.fecha<=I.hasta).sort((x,y)=>x.fecha.localeCompare(y.fecha))}))
    .filter(g=>!I.ocultar||g.rows.length);
  const all=grups.flatMap(g=>g.rows);
  return {grups,total:all.length,inf:all.filter(e=>compOk(e.comp)).length,pend:all.filter(e=>!compOk(e.comp)).length};
}
const compEstado=e=>compOk(e.comp)?"Informada":e.comp?.fecha?"Incompleta":"Sense informar";
const hora=(a,b)=>a?`${a}-${b}`:"";
const filaAud=e=>[fDMY(e.fecha),hora(e.inicio,e.fin),fDMY(e.comp?.fecha),unitat(e.comp),e.comp?.territorio||"",horaComp(e.comp),compEstado(e)];
const CAPS_DET=["Dia d'auditoria","Horari","Dia que compensa","Unitat on compensa","Territori","Horari de compensació","Estat"];

function textInforme(){
  const D=datosInforme(),M=metaInforme(),out=[`Dies d'auditoria i compensacions · ${M.per}`,""];

  return out.join("\n");
}

const LIBS={
  exceljs:["https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js","https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"],

const _libs={};
function cargar(name,ok){
  if(ok())return Promise.resolve();
  if(_libs[name])return _libs[name];
  return _libs[name]=(async()=>{for(const u of LIBS[name]){try{await new Promise((res,rej)=>{const sc=document.createElement("script");sc.src=u;sc.onload=res;sc.onerror=rej;document.head.appendChild(sc)});if(ok())return}catch(e){}}_libs[name]=null;throw new Error("lib")})();
}
function metaInforme(){
  const I=S.inf,ahora=new Date();
  return {gen:`${pad(ahora.getDate())}/${pad(ahora.getMonth()+1)}/${ahora.getFullYear()} ${pad(ahora.getHours())}:${pad(ahora.getMinutes())}`,

    file:`informe-auditories-SEM_${I.desde}_${I.hasta}`};
}
function logoPNG(){
  const c=document.createElement("canvas");c.width=560;c.height=120;const x=c.getContext("2d");
  x.fillStyle="#ffffff";x.fillRect(0,0,560,120);
  x.fillStyle="#1d2226";x.font="bold 40px 'Segoe UI', Arial, sans-serif";x.textBaseline="alphabetic";x.fillText("emergències mèdiques",4,44);
  x.fillStyle="#d4192c";for(let i=0;i<4;i++)x.fillRect(6+i*58,70,30,30);

/* ---------- proposta automàtica d'assignació ---------- */
function calculaProposta(){
  const pf=porFecha(),extra={},out=[];
  const dates=[...new Set(pendientes().filter(e=>e.fecha>=todayIso).map(e=>e.fecha))].sort();
  for(const k of dates){
    const all=pf.get(k)||[],need=minFor(k)-asignados(all);if(need<=0)continue;
    const mes=k.slice(0,7),ja=p=>asignadosMes(p,mes)+(extra[p+mes]||0);
    const cand=all.filter(e=>e.estado==="pendiente"&&!enVac(e.pid,k)).map(e=>({pid:e.pid,falta:objetivo(e.pid,mes)-ja(e.pid),tot:ja(e.pid)}))
      .sort((a,b)=>b.falta-a.falta||a.tot-b.tot||porNombre(a.pid,b.pid));
    for(const c of cand.slice(0,need)){out.push({pid:c.pid,fecha:k});extra[c.pid+mes]=(extra[c.pid+mes]||0)+1}
  }
  return out;
}
function vProposta(){
  const P=S.proposta;if(!P)return "";

/* ---------- quadrant mensual ---------- */
function quadrant(mes){
  const[y,m]=mes.split("-").map(Number),n=new Date(y,m,0).getDate(),rows=[];
  for(const p of auditores()){
    const mm=S.dias.get(p)||new Map(),cells=[],comps=[];let tot=0;
    const lib=new Set([...mm.values()].filter(d=>d.estado==="asignado"&&d.comp?.fecha).map(d=>d.comp.fecha));
    for(let d=1;d<=n;d++){const k=`${mes}-${pad(d)}`,e=mm.get(k);let v="";
      if(e?.estado==="asignado"){v=lib.has(k)?"AC":"A";tot++}else if(enVac(p,k))v="V";else if(lib.has(k))v="C";else if(e?.estado==="pendiente")v="?";
      cells.push(v)}
    for(const[f,d]of [...mm].sort((a,b)=>a[0].localeCompare(b[0])))if(d.estado==="asignado"&&f.startsWith(mes))comps.push({aud:f,comp:d.comp?.fecha||"",un:unitat(d.comp),terr:d.comp?.territorio||""});
    rows.push({pid:p,cells,tot,comps});
  }
  return {mes,y,m,n,rows,totals:Array.from({length:n},(_,i)=>rows.filter(r=>r.cells[i][0]==="A").length),
    wk:Array.from({length:n},(_,i)=>{const w=new Date(y,m-1,i+1).getDay();return w===0||w===6}),
    titol:`${MESES[m-1]} ${y}`};
}

    <td><input type="checkbox" id="eq-a-${esc(p)}" data-eqrole="auditor" data-p="${esc(p)}" ${q.auditor?"checked":""} aria-label="Auditor" ${dis}></td>
    <td><input type="checkbox" id="eq-g-${esc(p)}" data-eqrole="gestor" data-p="${esc(p)}" ${q.gestor?"checked":""} aria-label="Gestor" ${dis}></td>
    <td>${gh?`<input class="mid" id="eq-u-${esc(p)}" data-equser="${esc(p)}" value="${esc(q.usuario||"")}" placeholder="p. ex. pvazquez" aria-label="Usuari de ${esc(q.nombre)}" autocomplete="off" ${dis}>`:q.uid?`${esc(acc)}${q.uid===S.uid?" (tu)":""} ${S.demo?"":`<button class="btn sm" data-a="unlink" data-p="${esc(p)}">Desvincula</button>`}`:`<span class="muted">Sense vincular</span>`}</td>
    <td>${S.demo?"":`<button class="btn sm danger" data-a="delpers" data-p="${esc(p)}">Elimina</button>`}</td></tr>`}).join("")}
  </tbody></table></div>
  <form class="form mt" data-form="addpers"><label class="f">Persona nova<input id="np-nombre" name="nombre" required maxlength="60" placeholder="Nom i cognom"></label>
    <label class="f chk"><span><input type="checkbox" id="np-a" name="auditor" checked> Auditor/a</span></label>
    <label class="f chk"><span><input type="checkbox" id="np-g" name="gestor"> Gestor/a</span></label>
    <div><button class="btn primary" ${dis}>Afegeix a l'equip</button></div></form>
  <p class="hint">${gh?"Escriu al costat de cada persona el seu usuari: el mateix que has creat a Firebase, sense la part de l'arrova. Sense usuari assignat, aquella persona no pot veure ni modificar res.":`Cada persona vincula el seu nom el primer cop que obre l'aplicació. Si algú s'equivoca de nom, prem "Desvincula" i que torni a entrar.`}</p></section>
  <section class="panel"><h2>Còpia de seguretat</h2>
  <p class="lead">Descarrega un fitxer amb totes les dades: equip, regles, disponibilitats, compensacions i vacances. Si restaures una còpia, se sobreescriuen els registres que conté el fitxer; els que s'hagin creat després no s'esborren.</p>
  <div class="toolbar" style="margin-bottom:0"><button class="btn primary" data-a="backup" ${dis}>Descarrega una còpia</button><label class="f inline">Restaura una còpia<input type="file" id="rest-file" accept=".json,application/json" style="width:auto" ${dis}></label></div></section></div>`;
}

/* ---------- escrituras ---------- */
const dref=(p,f)=>S.db.doc(`disp/${p}/dias/${f}`);
const saveCfg=c=>S.db.doc("config/planificacion").set(c);
const saveEq=async e=>{const old=clone(S.equipo);await S.db.doc("config/equipo").set({personas:e});if(window.SEM_SYNC_ROLS)await window.SEM_SYNC_ROLS(e,old)};
async function guarda(fn,ok,det){
  if(S.demo){toast("A la vista d'exemple no es desen els canvis");return}
  if(preview()){toast(`Vista prèvia com a ${nombre(S.verComo)}: no es desen els canvis`);return}
  if(S.busy)return;S.busy=true;
  try{await fn();if(ok){toast(ok);logA(ok,det)}}
  catch(e){toast(e?.code==="permission_denied"||e?.code==="invalid_argument"?"No tens permís per fer aquest canvi.":"No s'ha pogut desar. Revisa la connexió i torna-ho a provar.")}
  finally{S.busy=false}
}
function confirmar(b,txt){if(b.dataset.c!=="1"){b.dataset.c="1";b.textContent=txt;return false}return true}

document.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-a]");if(!b||b.disabled)return;
  const a=b.dataset.a,v=b.dataset.v,p=b.dataset.p,f=b.dataset.f;
  if(a==="tab"){S.tab=v;remember();render();window.scrollTo(0,0);return}
  if(a==="mode"){S.mode=v;remember();render();return}
  if(a==="hoy"){S.cursor=new Date();render();return}
  if(a==="nav"){const n=+v,c=S.cursor;S.cursor=S.mode==="dia"?addDays(c,n):S.mode==="semana"?addDays(c,7*n):S.mode==="mes"?new Date(c.getFullYear(),c.getMonth()+n,1):new Date(c.getFullYear()+n,0,1);render();return}
  if(a==="navmes"){S.cursor=new Date(S.cursor.getFullYear(),S.cursor.getMonth()+(+v),1);render();return}
  if(a==="mesact"){S.cursor=new Date();render();return}
  if(a==="ir"){S.cursor=parse(v);S.mode="dia";S.tab="calendario";remember();render();window.scrollTo(0,0);return}
  if(a==="irmes"){S.cursor=new Date(S.cursor.getFullYear(),+v,1);S.mode="mes";remember();render();return}
  if(a==="vista"){if(v==="auditor"){const aud=auditores(),rp=realPid(),sel=$("ver-como")?.value;S.verComo=sel||((rp&&aud.includes(rp))?rp:aud[0]||null);S.vista="auditor";S.tab="calendario"}else{S.vista="gestor";S.tab="perfil"}S.filtro="todos";S.editComp=null;remember();render();window.scrollTo(0,0);toast(v==="auditor"?`Vista d'auditor/a: ${nombre(S.verComo)}`:"Vista de gestor/a");return}
  if(a==="infper"){const n=new Date(),y=n.getFullYear(),m=n.getMonth();const[a1,b1]=v==="mes"?[new Date(y,m,1),new Date(y,m+1,0)]:v==="sig"?[new Date(y,m+1,1),new Date(y,m+2,0)]:[new Date(y,0,1),new Date(y,11,31)];S.inf={...S.inf,desde:iso(a1),hasta:iso(b1)};render();return}
  if(a==="infxlsx"){exportar("xlsx");return}
  if(a==="infpdf"){exportar("pdf");return}
  if(a==="infcopy"){navigator.clipboard.writeText(textInforme()).then(()=>toast("Informe copiat: enganxa'l a l'Excel o en un correu")).catch(()=>toast("No s'ha pogut copiar. Selecciona la taula i copia-la manualment."));return}
  if(a==="proposa"){const P=calculaProposta();if(!P.length){toast("No hi ha res a proposar: els dies amb disponibilitat ja tenen el mínim cobert");return}S.proposta=P;render();return}
  if(a==="propno"){S.proposta=null;render();return}
  if(a==="propok"){const l=(S.proposta||[]).filter(x=>S.dias.get(x.pid)?.get(x.fecha)?.estado==="pendiente"&&!enVac(x.pid,x.fecha));S.proposta=null;
    guarda(async()=>{for(const x of l)await dref(x.pid,x.fecha).update({estado:"asignado",revisado:new Date().toISOString()})},`${l.length} dia(es) assignats segons la proposta`,l.map(x=>`${corto(x.pid)} ${fDMY(x.fecha).slice(0,5)}`).join(", ")).then(render);return}
  if(a==="editsol"){S.editSol=v;render();return}
  if(a==="cancelsol"){S.editSol=null;render();return}
  if(a==="solok"){guarda(()=>dref(p,f).update({estado:"descartado",revisado:new Date().toISOString(),solicitud:{estado:"acceptada",resolta:new Date().toISOString()}}),"Sol·licitud de canvi acceptada",`${nombre(p)} · ${fDMY(f)}`);return}
  if(a==="solno"){guarda(()=>dref(p,f).update({solicitud:{estado:"rebutjada",resolta:new Date().toISOString()}}),"Sol·licitud de canvi rebutjada",`${nombre(p)} · ${fDMY(f)}`);return}
  if(a==="seldia"){if(S.selDias.has(v))S.selDias.delete(v);else S.selDias.add(v);b.setAttribute("aria-pressed",S.selDias.has(v));const n=$("sel-n");if(n)n.textContent=selTxt();const sb=$("multi-btn");if(sb)sb.textContent=`Envia la disponibilitat (${S.selDias.size})`;return}
  if(a==="selmes"){S.selMes=new Date(S.selMes.getFullYear(),S.selMes.getMonth()+(+v),1);render();return}
  if(a==="avisok"){try{localStorage.setItem(lvKey(),new Date().toISOString())}catch(e){}S.avisOk=true;render();return}
  if(a==="backup"){guardarArchivo(`copia-seguretat-auditories_${todayIso}.json`,JSON.stringify(dadesBackup(),null,1));logA("Còpia de seguretat descarregada");return}
  if(a==="qxlsx"){exportar("qxlsx");return}
  if(a==="qpdf"){exportar("qpdf");return}
  if(a==="sitano"){S.sitYear+=(+v);render();return}
  if(a==="skiplink"){S.skipLink=true;render();return}
  if(a==="estado"){
    if(v==="asignado"&&enVac(p,f)){toast("No es pot assignar: està de vacances aquell dia");return}
    guarda(()=>dref(p,f).update({estado:v,revisado:new Date().toISOString()}),v==="asignado"?"Dia assignat":v==="descartado"?"Disponibilitat descartada":"Tornada a pendent",`${nombre(p)} · ${fDMY(f)}`);return}
  if(a==="asigntodo"){const l=pendientes().filter(e=>e.fecha===v&&!enVac(e.pid,v));
    guarda(async()=>{for(const e of l)await dref(e.pid,v).update({estado:"asignado",revisado:new Date().toISOString()})},`${l.length} disponibilitat(s) assignada(es)`,fDMY(v));return}
  if(a==="editcomp"){S.editComp=v;render();return}
  if(a==="cancelcomp"){S.editComp=null;render();return}
  if(a==="borrar"){if(!confirmar(b,"Segur? Retira"))return;guarda(()=>dref(p,f).delete(),"Disponibilitat retirada",`${nombre(p)} · ${fDMY(f)}`);return}
  if(a==="delvac"){if(!confirmar(b,"Segur? Elimina"))return;const l=(S.vac.get(p)||[]).filter(x=>x.id!==v);guarda(()=>S.db.doc(`vacaciones/${p}`).set({periodos:l}),"Vacances eliminades",nombre(p));return}
  if(a==="delmin"){const c=clone(S.cfg);delete c.minDias[v];guarda(()=>saveCfg(c),"Mínim del dia restablert",fDMY(v));return}
  if(a==="unlink"){if(!confirmar(b,"Segur? Desvincula"))return;const e=clone(S.equipo);e[p].uid=null;guarda(()=>saveEq(e),"Compte desvinculat",nombre(p));return}
  if(a==="delpers"){
    if(S.equipo[p].gestor&&gestores().length<=1){toast("Ha de quedar com a mínim un gestor/a");return}
    if(!confirmar(b,"Segur? Elimina"))return;const e=clone(S.equipo);delete e[p];guarda(()=>saveEq(e),"Persona eliminada de l'equip",nombre(p));return}
});
document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.id==="filtro"){S.filtro=t.value;render();return}
  if(t.id==="ver-como"){S.verComo=t.value;remember();if(simulando()){toast(`Vista d'auditor/a: ${nombre(t.value)}`)}render();return}
  if(t.id&&t.id.startsWith("inf-")){const k=t.id.slice(4);S.inf={...S.inf,[k]:t.type==="checkbox"?t.checked:t.value};render();return}
  if(t.id==="sit-pid"){S.sitPid=t.value;render();return}
  if(t.id==="vac-pid"){S.vacPid=t.value;render();return}
  if(t.id==="c-dur"||t.id==="c-ini-s"){const d=$("c-dur").value,alt=d==="altres",sel=$("c-ini-s"),ti=$("c-ini-t"),fi=$("c-fin");
    if(t.id==="c-dur"){sel.hidden=sel.disabled=alt;ti.hidden=ti.disabled=!alt;fi.readOnly=!alt;
      if(!alt){const cur=sel.value;sel.innerHTML=`<option value="">Selecciona…</option>`+HORES(d).map(h=>`<option ${cur===h?"selected":""}>${h}</option>`).join("")}}
    if(!alt)fi.value=sel.value?fiDe(sel.value,d):"";return}
  if(t.id==="d-franja"){const fr=FRANJAS[t.value];if(fr.i){$("d-ini").value=fr.i;$("d-fin").value=fr.f}return}
  if(t.id==="daymin"){const k=t.dataset.k,v=parseInt(t.value,10);if(!(v>=1))return;const c=clone(S.cfg);c.minDias=c.minDias||{};if(v===c.minPorDia)delete c.minDias[k];else c.minDias[k]=v;guarda(()=>saveCfg(c),`Mínim del dia: ${v}`,fDMY(k));return}
  if(t.dataset.obj){const p=t.dataset.obj,mes=ym(S.cursor),v=t.value===""?null:parseInt(t.value,10);const c=clone(S.cfg);c.objetivosMes=c.objetivosMes||{};c.objetivosMes[mes]=c.objetivosMes[mes]||{};
    if(v===null||Number.isNaN(v))delete c.objetivosMes[mes][p];else c.objetivosMes[mes][p]=Math.max(0,Math.min(31,v));
    if(!Object.keys(c.objetivosMes[mes]).length)delete c.objetivosMes[mes];
    guarda(()=>saveCfg(c),`Objectiu de ${nombre(p)} per a ${fMes(S.cursor)} actualitzat`);return}
  if(t.id==="quad-mes"){if(t.value){S.quadMes=t.value;render()}return}
  if(t.id==="rest-file"){if(t.files[0])restaura(t.files[0]).then(()=>{t.value=""});return}
  if(t.dataset.equser!==undefined){const p=t.dataset.equser,u=t.value.trim().toLowerCase().replace(/@.*$/,"");
    if(u&&Object.keys(S.equipo).some(q=>q!==p&&S.equipo[q].usuario===u)){toast("Aquest usuari ja està assignat a una altra persona");t.value=S.equipo[p].usuario||"";return}
    const e=clone(S.equipo);e[p].usuario=u||null;guarda(()=>saveEq(e),"Usuari assignat",`${nombre(p)} · ${u||"cap"}`);return}
  if(t.dataset.eqname){const p=t.dataset.eqname,n=t.value.trim();if(!n){t.value=nombre(p);return}const e=clone(S.equipo);e[p].nombre=n;guarda(()=>saveEq(e),"Nom actualitzat");return}
  if(t.dataset.eqrole){const p=t.dataset.p,r=t.dataset.eqrole;
    if(r==="gestor"&&!t.checked&&gestores().length<=1){t.checked=true;toast("Ha de quedar com a mínim un gestor/a");return}
    const e=clone(S.equipo);e[p][r]=t.checked;guarda(()=>saveEq(e),`Rol actualitzat: ${nombre(p)}`);return}
});
document.addEventListener("submit",ev=>{
  ev.preventDefault();const f=ev.target,fd=Object.fromEntries(new FormData(f)),me=mePid();
  const k=f.dataset.form;
  if(k==="link"){if(!fd.pid)return;guarda(()=>S.db.doc("config/equipo").update({personas:{[fd.pid]:{uid:S.uid}}}),`Benvingut/da, ${nombre(fd.pid)}`);return}
  if(k==="disp"){
    if(enVac(me,fd.fecha)){toast("Aquest dia estàs de vacances");return}
    const ex=S.dias.get(me)?.get(fd.fecha);
    if(ex&&ex.estado==="asignado"){toast("Aquest dia ja està assignat. Demana al gestor/a que el modifiqui.");return}
    if(fd.inicio===fd.fin){toast("L'hora d'inici i la de fi no poden coincidir");return}
    guarda(async()=>{await dref(me,fd.fecha).set({fecha:fd.fecha,franja:fd.franja,inicio:fd.inicio,fin:fd.fin,nota:(fd.nota||"").trim(),estado:"pendiente",enviado:new Date().toISOString()});f.reset();$("d-ini").value=FRANJAS.manana.i;$("d-fin").value=FRANJAS.manana.f},"Disponibilitat enviada al gestor/a",`${nombre(me)} · ${fDMY(fd.fecha)}`);return}
  if(k==="sol"){const p=f.dataset.p,fecha=f.dataset.f;guarda(async()=>{await dref(p,fecha).update({solicitud:{motivo:fd.motivo.trim(),fecha:new Date().toISOString(),estado:"pendent"}});S.editSol=null},"Sol·licitud de canvi enviada",`${nombre(p)} · ${fDMY(fecha)} · ${fd.motivo.trim()}`);return}
  if(k==="dispmulti"){const dies=[...S.selDias].sort().filter(d=>d>=todayIso&&!enVac(me,d)&&!S.dias.get(me)?.get(d));
    if(!dies.length){toast("Selecciona com a mínim un dia al calendari");return}
    if(fd.inicio===fd.fin){toast("L'hora d'inici i la de fi no poden coincidir");return}
    guarda(async()=>{for(const d of dies)await dref(me,d).set({fecha:d,franja:fd.franja,inicio:fd.inicio,fin:fd.fin,nota:(fd.nota||"").trim(),estado:"pendiente",enviado:new Date().toISOString()});S.selDias.clear()},`Disponibilitat enviada: ${dies.length} dia(es)`,`${nombre(me)} · ${dies.map(d=>fDMY(d).slice(0,5)).join(", ")}`);return}
  if(k==="comp"){const p=f.dataset.p,fecha=f.dataset.f;
    const nova={fecha:fd.fecha,recurso:(fd.recurso||"").trim(),indicativo:(fd.indicativo||"").trim().toUpperCase(),territorio:(fd.territorio||"").trim(),inicio:fd.inicio||"",fin:fd.durada==="altres"?(fd.fin||""):(fd.inicio?fiDe(fd.inicio,fd.durada):""),durada:fd.durada||"altres"},falta=compFalta(nova);
    if(!falta.length&&nova.durada!=="altres"&&!HORES(nova.durada).includes(nova.inicio)){toast("Tria una hora d'inici de la llista");return}
    if(falta.length){toast(`No es pot desar la compensació: falta ${falta.join(", ")}`);return}
    guarda(async()=>{await dref(p,fecha).update({comp:nova,compInformada:new Date().toISOString()});S.editComp=null},"Compensació desada",`${nombre(p)} · auditoria ${fDMY(fecha)} · compensa ${fDMY(fd.fecha)} a ${fd.recurso} ${fd.indicativo.toUpperCase()}`);return}
  if(k==="vac"){const p=S.vacPid;if(fd.hasta<fd.desde){toast("La data final no pot ser anterior a la inicial");return}
    const l=(S.vac.get(p)||[]).slice();if(l.some(v=>fd.desde<=v.hasta&&v.desde<=fd.hasta)){toast("Se solapa amb un altre període de vacances");return}
    l.push({id:Date.now().toString(36),desde:fd.desde,hasta:fd.hasta,nota:(fd.nota||"").trim()});
    guarda(async()=>{await S.db.doc(`vacaciones/${p}`).set({periodos:l});f.reset()},"Vacances registrades",`${nombre(p)} · ${fDMY(fd.desde)} – ${fDMY(fd.hasta)}`);return}
  if(k==="cfg"){const c=clone(S.cfg);c.minPorDia=Math.max(1,parseInt(fd.minPorDia,10)||2);c.objetivoDefecto=Math.max(0,parseInt(fd.objetivoDefecto,10)||0);guarda(()=>saveCfg(c),"Regles desades");return}
  if(k==="minday"){const c=clone(S.cfg);c.minDias=c.minDias||{};c.minDias[fd.fecha]=Math.max(1,parseInt(fd.min,10)||1);guarda(async()=>{await saveCfg(c);f.reset()},"Dia amb mínim especial afegit",`${fDMY(fd.fecha)} · mínim ${fd.min}`);return}
  if(k==="addpers"){const n=fd.nombre.trim();if(!n)return;let id=slug(n),i=2;while(S.equipo[id])id=slug(n)+"-"+i++;
    const e=clone(S.equipo);e[id]={nombre:n,auditor:!!fd.auditor,gestor:!!fd.gestor,uid:null};guarda(async()=>{await saveEq(e);f.reset()},`${n} afegit/da a l'equip`);return}
});

/* ---------- carga ---------- */
async function resolveNames(){
  if(!S.user)return;const ids=Object.values(S.equipo).map(q=>q.uid).filter(Boolean);if(!ids.length)return;
  try{const ps=await S.user.profiles(ids);for(const id of ids){const n=ps?.[id]?.name;if(n)S.names.set(id,n)}}catch(e){}
  render();
}
function syncSubs(){
  const want=new Set(auditores());
  for(const p of want)if(!S.subs.has(p))S.subs.set(p,S.db.collection(`disp/${p}/dias`).onSnapshot(ds=>{const m=new Map();for(const d of ds.docs)m.set(d.id,d.data());S.dias.set(p,m);render()},()=>{}));
  for(const p of [...S.subs.keys()])if(!want.has(p)){S.subs.get(p)();S.subs.delete(p);S.dias.delete(p)}
}
function demo(){S.demo=true;S.loaded=true;S.eqLoaded=true;render()}
async function start(){
  render();
  claude.use("downloads").then(d=>{S.dl=d;render()}).catch(()=>{});
  const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
  if(!db){demo();return}
  S.db=db;S.user=user;S.username=window.SEM_USER?window.SEM_USER():null;
  try{if(user){S.uid=await user.id();S.owner=await user.isOwner();const cw=await user.can("data.write");S.canWrite=cw!==false}}catch(e){}
  const timer=setTimeout(()=>{S.stale=true;S.loaded=true;render()},10000);
  db.doc("config/equipo").onSnapshot(s=>{if(!s.metadata.fromCache){clearTimeout(timer);S.stale=false}S.eqLoaded=true;S.loaded=true;S.equipo=s.exists?clone(s.data().personas):{};syncSubs();resolveNames();render()},()=>{clearTimeout(timer);S.stale=true;S.loaded=true;render()});
  db.doc("config/planificacion").onSnapshot(s=>{if(s.exists){const d=s.data();S.cfg={minPorDia:d.minPorDia||2,minDias:d.minDias||{},objetivoDefecto:Number.isFinite(d.objetivoDefecto)?d.objetivoDefecto:2,objetivosMes:d.objetivosMes||{}}}render()},()=>{});
  db.collection("vacaciones").onSnapshot(s=>{S.vac=new Map(s.docs.map(d=>[d.id,(d.data().periodos||[])]));render()},()=>{});
}
function tick(){const d=new Date();$("hora").textContent=d.toLocaleTimeString("ca-ES",{hour12:false});$("fecha").textContent=d.toLocaleDateString("ca-ES",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}
tick();setInterval(tick,1000);
start();
</script>
